# Rebuilds the profile drawing once a day and commits the result.
#
# scripts/build.py generates everything on the profile from data/profile.toml:
# the six SVG sheets in assets/, the chips, and README.md itself. This workflow
# is the only thing that keeps them current; nothing renders at request time.

name: Daily

on:
  schedule:
    # 13:00 UTC. GitHub cron is ALWAYS UTC and does not observe daylight saving,
    # so this lands at 06:00 America/Los_Angeles during PDT and drifts to 05:00
    # during PST. That is expected. A fixed local hour year-round would need two
    # cron lines and a date guard, which is not worth it for a card refresh.
    # See SETUP.md to change the hour.
    - cron: "0 13 * * *"

  # Manual button in the Actions tab, for when you want it now.
  workflow_dispatch:

  # Editing the config should regenerate immediately rather than waiting a day.
  push:
    branches: [main]
    paths:
      - "data/profile.toml"
      - "scripts/**"
      - ".github/workflows/daily.yml"

permissions:
  contents: write

# One build at a time. Two overlapping runs would both commit and the second
# push would be rejected as non-fast-forward. cancel-in-progress is deliberately
# false: killing a run mid-push is worse than making it queue for a minute.
concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # The push step needs real credentials on the remote.
          persist-credentials: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # No cache key and no pip install: build.py is pure standard library
          # (tomllib, urllib, json). Nothing to resolve, nothing to lock.

      - name: Build cards and README
        # NOT continue-on-error, and that is the whole point of this comment.
        #
        # The two failure modes are not the same thing.
        #
        #   Transient upstream failure: the GitHub API is rate limited or times
        #   out. build.py already swallows these internally and renders the
        #   affected channel as a dashed "NO DATA" cell. It exits 0. The run
        #   stays green and the profile shows a sheet with one blank field.
        #   Nothing to do here. The degradation lives in the script, which is
        #   the right place for it because it also works when you run locally.
        #
        #   Genuine build crash: a malformed profile.toml, a status/completion
        #   band violation, a traceback in a renderer. build.py exits non-zero
        #   and this step fails, red X, no commit. That is what you want. The
        #   committed assets stay at yesterday's good state and you get told.
        #
        # Wrapping this in continue-on-error would convert the second case into
        # a silent no-op and you would only find out weeks later when you
        # noticed the cards had stopped moving.
        run: python3 scripts/build.py
        env:
          # Built-in, scoped to this repo, nothing to configure. It is also the
          # only secret this build wants: every figure on the profile now comes
          # from the GitHub API, so there is nothing else to hold a key for.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only these two paths. Anything else the build happens to touch
          # (__pycache__, scratch files) is not ours to commit.
          git add -- assets README.md

          if git diff --cached --quiet; then
            echo "Nothing to commit: assets/ and README.md are unchanged."
            exit 0
          fi

          git commit -m "Rebuild profile drawing"

          # Push with retry. The concurrency group stops this workflow racing
          # itself, but a human commit landing on main in the same minute would
          # still reject the push. Rebase and retry rather than failing a run
          # over a timing collision.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/main."
            git pull --rebase --autostash origin main
          done

          echo "Could not push after 3 attempts." >&2
          exit 1
