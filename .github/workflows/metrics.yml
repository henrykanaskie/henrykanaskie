# Optional extras from lowlighter/metrics.
#
# This workflow is manual-only on purpose: every step needs a METRICS_TOKEN
# repo secret (a classic PAT), and without it the run fails and leaves a red X
# on the profile. The README does not embed anything this produces — the cards
# it shows are generated by scripts/gen_cards.py instead.
#
# To use it: add METRICS_TOKEN under Settings → Secrets and variables → Actions
# (scopes: repo, read:user), run this workflow by hand, then embed the SVGs it
# commits to metrics/ in the README.

name: Metrics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # ── Overview header: bio, activity, community ──────────────────────
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/overview.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: henrykanaskie
          committer_branch: main
          config_timezone: America/Los_Angeles
          base: header, activity, community, repositories, metadata
          config_display: large
          config_animations: yes

      # ── Featured repositories ──────────────────────────────────────────
      - name: Featured repositories
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/repositories.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: henrykanaskie
          committer_branch: main
          config_timezone: America/Los_Angeles
          base: ""
          plugin_repositories: yes
          plugin_repositories_featured: >-
            henrykanaskie/gpt-scratch,
            henrykanaskie/ML_quantitative_research,
            henrykanaskie/Cap_Match_Net,
            henrykanaskie/small-shell,
            henrykanaskie/rLog,
            henrykanaskie/emnist
          plugin_repositories_pinned: 6
          plugin_repositories_order: featured, pinned, starred
          plugin_repositories_forks: no
          plugin_repositories_affiliations: owner

      # ── Isometric commit calendar ──────────────────────────────────────
      - name: Isometric commit calendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: henrykanaskie
          committer_branch: main
          config_timezone: America/Los_Angeles
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # ── Languages: most-used and recently-used ─────────────────────────
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: henrykanaskie
          committer_branch: main
          config_timezone: America/Los_Angeles
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: html, css, tex, less, dockerfile, makefile, jupyter notebook
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15

      # ── Starred topics, rendered as icons ──────────────────────────────
      - name: Topics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/topics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: henrykanaskie
          committer_branch: main
          config_timezone: America/Los_Angeles
          base: ""
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_sort: stars
          plugin_topics_limit: 15

      # ── Coding habits and activity rhythm ──────────────────────────────
      - name: Habits
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/habits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: henrykanaskie
          committer_branch: main
          config_timezone: America/Los_Angeles
          base: ""
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

      # ── Lines of code changed over time ────────────────────────────────
      - name: Lines of code
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/lines.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: henrykanaskie
          committer_branch: main
          config_timezone: America/Los_Angeles
          base: ""
          plugin_lines: yes
          plugin_lines_sections: base, repositories
          plugin_lines_repositories_limit: 6
