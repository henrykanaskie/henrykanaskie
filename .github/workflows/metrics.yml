name: Metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # ── Isometric commit calendar ──────────────────────────────────────
      - name: Isometric commit calendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: henrykanaskie
          committer_branch: main
          config_timezone: America/Los_Angeles
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # ── Languages: most-used and recently-used ─────────────────────────
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: henrykanaskie
          committer_branch: main
          config_timezone: America/Los_Angeles
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: html, css, tex, less, dockerfile, makefile, jupyter notebook
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15

      # ── Starred topics, rendered as icons ──────────────────────────────
      - name: Topics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/topics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: henrykanaskie
          committer_branch: main
          config_timezone: America/Los_Angeles
          base: ""
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_sort: stars
          plugin_topics_limit: 15

      # ── Coding habits and activity rhythm ──────────────────────────────
      - name: Habits
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/habits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: henrykanaskie
          committer_branch: main
          config_timezone: America/Los_Angeles
          base: ""
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

      # ── Lines of code changed over time ────────────────────────────────
      - name: Lines of code
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/lines.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: henrykanaskie
          committer_branch: main
          config_timezone: America/Los_Angeles
          base: ""
          plugin_lines: yes
          plugin_lines_sections: base, repositories
          plugin_lines_repositories_limit: 6
