lcMode="spline" keySplines="0.3 0.9 0.3 1" keyTimes="0;1"/></line><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.58s" fill="freeze"/><text x="26.0" y="166.0" fill="#d7e6f2" font-size="10.5" font-weight="400" text-anchor="start">1.</text><text x="44.9" y="166.0" fill="#d7e6f2" font-size="10.5" font-weight="400" text-anchor="start">Mostly on</text><text x="107.9" y="166.0" fill="#d7e6f2" font-size="10.5" font-weight="600" text-anchor="start">retrieval over code</text><text x="233.9" y="166.0" fill="#d7e6f2" font-size="10.5" font-weight="400" text-anchor="start">right now: AST-aware chunking, embeddings, citations that hold up</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.66s" fill="freeze"/><text x="26.0" y="189.5" fill="#d7e6f2" font-size="10.5" font-weight="400" text-anchor="start">2.</text><text x="44.9" y="189.5" fill="#d7e6f2" font-size="10.5" font-weight="400" text-anchor="start">Just finished</text><text x="133.1" y="189.5" fill="#d7e6f2" font-size="10.5" font-weight="600" text-anchor="start">Floralytics</text><text x="202.4" y="189.5" fill="#d7e6f2" font-size="10.5" font-weight="400" text-anchor="start">, which factors Oregon's bee-plant records into habitat advice</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.74s" fill="freeze"/><text x="26.0" y="213.0" fill="#d7e6f2" font-size="10.5" font-weight="400" text-anchor="start">3.</text><text x="44.9" y="213.0" fill="#d7e6f2" font-size="10.5" font-weight="400" text-anchor="start">Happiest in a debugger, at the point where the theory stops matching the trace</text></g><line x1="26.0" y1="242.5" x2="874.0" y2="242.5" stroke="#28425c" stroke-width="0.8" stroke-dasharray="848.0" opacity="1.0"><animate attributeName="stroke-dashoffset" from="848.0" to="0" dur="0.8s" begin="0.18s" fill="freeze" calcMode="spline" keySplines="0.3 0.9 0.3 1" keyTimes="0;1"/></line><g opacity="1"><animate attri