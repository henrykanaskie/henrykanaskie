 y="136.0" fill="#16202b" font-size="13" font-weight="400" text-anchor="start">wrote it.</text></g><line x1="26.0" y1="161.0" x2="874.0" y2="161.0" stroke="#cdc4b4" stroke-width="0.8" stroke-dasharray="848.0" opacity="1.0"><animate attributeName="stroke-dashoffset" from="848.0" to="0" dur="0.8s" begin="0.10s" fill="freeze" calcMode="spline" keySplines="0.3 0.9 0.3 1" keyTimes="0;1"/></line><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.58s" fill="freeze"/><text x="26.0" y="185.0" fill="#16202b" font-size="10.5" font-weight="400" text-anchor="start">1.</text><text x="44.9" y="185.0" fill="#16202b" font-size="10.5" font-weight="400" text-anchor="start">Master's in CS at</text><text x="158.3" y="185.0" fill="#16202b" font-size="10.5" font-weight="600" text-anchor="start">Oregon State</text><text x="233.9" y="185.0" fill="#16202b" font-size="10.5" font-weight="400" text-anchor="start">. Two years of undergrad research in the plasma lab before that</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.66s" fill="freeze"/><text x="26.0" y="208.5" fill="#16202b" font-size="10.5" font-weight="400" text-anchor="start">2.</text><text x="44.9" y="208.5" fill="#16202b" font-size="10.5" font-weight="400" text-anchor="start">Six months at</text><text x="133.1" y="208.5" fill="#16202b" font-size="10.5" font-weight="600" text-anchor="start">DZYNE Technologies</text><text x="246.5" y="208.5" fill="#16202b" font-size="10.5" font-weight="400" text-anchor="start">, writing embedded C and C++ and the Python test framework around it</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.74s" fill="freeze"/><text x="26.0" y="232.0" fill="#16202b" font-size="10.5" font-weight="400" text-anchor="start">3.</text><text x="44.9" y="232.0" fill="#16202b" font-size="10.5" font-weight="400" text-anchor="start">Outside of school: photography, skiing, lifting</text></g><line x1="26.0"