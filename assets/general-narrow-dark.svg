="1.4" opacity="0.55"/><path d="M285.0 480.0 L292.0 480.0 L292.0 473.0" fill="none" stroke="#d7e6f2" stroke-width="1.4" opacity="0.55"/><text x="18.0" y="23.0" fill="#5d788f" font-size="8" font-weight="400" text-anchor="start" letter-spacing="1.6">GENERAL NOTES</text><text x="282.0" y="472.0" fill="#5d788f" font-size="7.5" font-weight="400" text-anchor="end" letter-spacing="1.2">SH 2 / 7</text><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.30s" fill="freeze"/><text x="18.0" y="48.0" fill="#d7e6f2" font-size="10" font-weight="400" text-anchor="start">I work at the boundary between models and</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.34s" fill="freeze"/><text x="18.0" y="62.5" fill="#d7e6f2" font-size="10" font-weight="400" text-anchor="start">hardware. A transformer written from first</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.38s" fill="freeze"/><text x="18.0" y="77.0" fill="#d7e6f2" font-size="10" font-weight="400" text-anchor="start">principles, an optimizer that picks</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.42s" fill="freeze"/><text x="18.0" y="91.5" fill="#d7e6f2" font-size="10" font-weight="400" text-anchor="start">capacitor values you can actually buy, a</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.46s" fill="freeze"/><text x="18.0" y="106.0" fill="#d7e6f2" font-size="10" font-weight="400" text-anchor="start">habit tracker that draws your streaks as a</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.50s" fill="freeze"/><text x="18.0" y="120.5" fill="#d7e6f2" font-size="10" font-weight="400" text-anchor="start">neural graph. Most of it starts as a</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.54s" fill="freeze"/><text x="18.0" y="135.0" fill="#d7e6f2" font-size="10" font-weight="400" text-anchor="start">question I couldn't answer by reading, so I</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.58s" fill="freeze"/><text x="18.0" y="149.5" fill="#d7e6f2" font-size="10" font-weight="400" text-anchor="start">write the thing that answers it.</text></g><line x1="18.0" y1="170.0" x2="282.0" y2="170.0" stroke="#28425c" stroke-width="0.8" stroke-dasharray="264.0" opacity="1.0"><animate attributeName="stroke-dashoffset" from="264.0" to="0" dur="0.8s" begin="0.10s" fill="freeze" calcMode="spline" keySplines="0.3 0.9 0.3 1" keyTimes="0;1"/></line><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.58s" fill="freeze"/><text x="18.0" y="190.0" fill="#d7e6f2" font-size="9.5" font-weight="400" text-anchor="start">1.</text><text x="35.1" y="190.0" fill="#d7e6f2" font-size="9.5" font-weight="400" text-anchor="start">Mostly on</text><text x="92.1" y="190.0" fill="#d7e6f2" font-size="9.5" font-weight="600" text-anchor="start">quantitative research</text><text x="217.5" y="190.0" fill="#d7e6f2" font-size="9.5" font-weight="400" text-anchor="start">right now:</text><text x="35.1" y="203.5" fill="#d7e6f2" font-size="9.5" font-weight="400" text-anchor="start">block bootstrapping, log returns,</text><text x="35.1" y="217.0" fill="#d7e6f2" font-size="9.5" font-weight="400" text-anchor="start">correlation structure</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.66s" fill="freeze"/><text x="18.0" y="238.5" fill="#d7e6f2" font-size="9.5" font-weight="400" text-anchor="start">2.</text><text x="35.1" y="238.5" fill="#d7e6f2" font-size="9.5" font-weight="400" text-anchor="start">Just finished a</text><text x="126.3" y="238.5" fill="#d7e6f2" font-size="9.5" font-weight="600" text-anchor="start">GPT from scratch</text><text x="217.5" y="238.5" fill="#d7e6f2" font-size="9.5" font-weight="400" text-anchor="start">, largely</text><text x="35.1" y="252.0" fill="#d7e6f2" font-size="9.5" font-weight="400" text-anchor="start">to stop treating attention as a black box</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.74s" fill="freeze"/><text x="18.0" y="273.5" fill="#d7e6f2" font-size="9.5" font-weight="400" text-anchor="start">3.</text><text x="35.1" y="273.5" fill="#d7e6f2" font-size="9.5" font-weight="400" text-anchor="start">Happiest in a debugger, at the point where</text><text x="35.1" y="287.0" fill="#d7e6f2" font-size="9.5" font-weight="400" text-anchor="start">the theory stops matching the trace</text></g><line x1="18.0" y1="312.5" x2="282.0" y2="312.5" stroke="#28425c" stroke-width="0.8" stroke-dasharray="264.0" opacity="1.0"><animate attributeName="stroke-dashoffset" from="264.0" to="0" dur="0.8s" begin="0.18s" fill="freeze" calcMode="spline" keySplines="0.3 0.9 0.3 1" keyTimes="0;1"/></line><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.50s" fill="freeze"/><text x="18.0" y="330.5" fill="#5d788f" font-size="7" font-weight="400" text-anchor="start" letter-spacing="1.1">FOCUS</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.88s" fill="freeze"/><rect x="18.0" y="342.5" width="100.5" height="17" rx="2" fill="none" stroke="#28425c" stroke-width="0.9"/></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.88s" fill="freeze"/><text x="68.3" y="354.0" fill="#8ba3b8" font-size="7.4" font-weight="400" text-anchor="middle" letter-spacing="0.9">MACHINE LEARNING</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.92s" fill="freeze"/><rect x="125.5" y="342.5" width="79.2" height="17" rx="2" fill="none" stroke="#28425c" stroke-width="0.9"/></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.92s" fill="freeze"/><text x="165.1" y="354.0" fill=