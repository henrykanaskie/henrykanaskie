="1.4" opacity="0.55"/><path d="M285.0 512.0 L292.0 512.0 L292.0 505.0" fill="none" stroke="#d7e6f2" stroke-width="1.4" opacity="0.55"/><text x="18.0" y="23.0" fill="#5d788f" font-size="8" font-weight="400" text-anchor="start" letter-spacing="1.6">GENERAL NOTES</text><text x="282.0" y="504.0" fill="#5d788f" font-size="7.5" font-weight="400" text-anchor="end" letter-spacing="1.2">SH 2 / 6</text><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.30s" fill="freeze"/><text x="18.0" y="48.0" fill="#d7e6f2" font-size="10" font-weight="400" text-anchor="start">I'm a computer science student at Oregon</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.34s" fill="freeze"/><text x="18.0" y="62.5" fill="#d7e6f2" font-size="10" font-weight="400" text-anchor="start">State, working on a master's after finishing</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.38s" fill="freeze"/><text x="18.0" y="77.0" fill="#d7e6f2" font-size="10" font-weight="400" text-anchor="start">my undergrad there. Most of what's on this</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.42s" fill="freeze"/><text x="18.0" y="91.5" fill="#d7e6f2" font-size="10" font-weight="400" text-anchor="start">sheet exists because I wanted to use it, or</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.46s" fill="freeze"/><text x="18.0" y="106.0" fill="#d7e6f2" font-size="10" font-weight="400" text-anchor="start">because I didn't understand something well</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.50s" fill="freeze"/><text x="18.0" y="120.5" fill="#d7e6f2" font-size="10" font-weight="400" text-anchor="start">enough and building it was the only way I</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.54s" fill="freeze"/><text x="18.0" y="135.0" fill="#d7e6f2" font-size="10" font-weight="400" text-anchor="start">was going to. Some of it came out of</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.58s" fill="freeze"/><text x="18.0" y="149.5" fill="#d7e6f2" font-size="10" font-weight="400" text-anchor="start">research: a matching-network solver for the</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.62s" fill="freeze"/><text x="18.0" y="164.0" fill="#d7e6f2" font-size="10" font-weight="400" text-anchor="start">plasma lab, signal processing for thruster</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.66s" fill="freeze"/><text x="18.0" y="178.5" fill="#d7e6f2" font-size="10" font-weight="400" text-anchor="start">data. The rest is tools I open every day,</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.70s" fill="freeze"/><text x="18.0" y="193.0" fill="#d7e6f2" font-size="10" font-weight="400" text-anchor="start">and a leaderboard for my group chat.</text></g><line x1="18.0" y1="213.5" x2="282.0" y2="213.5" stroke="#28425c" stroke-width="0.8" stroke-dasharray="264.0" opacity="1.0"><animate attributeName="stroke-dashoffset" from="264.0" to="0" dur="0.8s" begin="0.10s" fill="freeze" calcMode="spline" keySplines="0.3 0.9 0.3 1" keyTimes="0;1"/></line><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.58s" fill="freeze"/><text x="18.0" y="233.5" fill="#d7e6f2" font-size="9.5" font-weight="400" text-anchor="start">1.</text><text x="35.1" y="233.5" fill="#d7e6f2" font-size="9.5" font-weight="400" text-anchor="start">Master's in CS at</text><text x="137.7" y="233.5" fill="#d7e6f2" font-size="9.5" font-weight="600" text-anchor="start">Oregon State</text><text x="206.1" y="233.5" fill="#d7e6f2" font-size="9.5" font-weight="400" text-anchor="start">, after two</text><text x="35.1" y="247.0" fill="#d7e6f2" font-size="9.5" font-weight="400" text-anchor="start">years of undergrad research in the plasma</text><text x="35.1" y="260.5" fill="#d7e6f2" font-size="9.5" font-weight="400" text-anchor="start">lab</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.66s" fill="freeze"/><text x="18.0" y="282.0" fill="#d7e6f2" font-size="9.5" font-weight="400" text-anchor="start">2.</text><text x="35.1" y="282.0" fill="#d7e6f2" font-size="9.5" font-weight="400" text-anchor="start">Six months at</text><text x="114.9" y="282.0" fill="#d7e6f2" font-size="9.5" font-weight="600" text-anchor="start">DZYNE Technologies</text><text x="223.2" y="282.0" fill="#d7e6f2" font-size="9.5" font-weight="400" text-anchor="start">on</text><text x="35.1" y="295.5" fill="#d7e6f2" font-size="9.5" font-weight="400" text-anchor="start">embedded C/C++ and the test framework</text><text x="35.1" y="309.0" fill="#d7e6f2" font-size="9.5" font-weight="400" text-anchor="start">around it</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.74s" fill="freeze"/><text x="18.0" y="330.5" fill="#d7e6f2" font-size="9.5" font-weight="400" text-anchor="start">3.</text><text x="35.1" y="330.5" fill="#d7e6f2" font-size="9.5" font-weight="400" text-anchor="start">Away from a keyboard I'm usually behind a</text><text x="35.1" y="344.0" fill="#d7e6f2" font-size="9.5" font-weight="400" text-anchor="start">camera, on skis, or in the gym</text></g><line x1="18.0" y1="369.5" x2="282.0" y2="369.5" stroke="#28425c" stroke-width="0.8" stroke-dasharray="264.0" opacity="1.0"><animate attributeName="stroke-dashoffset" from="264.0" to="0" dur="0.8s" begin="0.18s" fill="freeze" calcMode="spline" keySplines="0.3 0.9 0.3 1" keyTimes="0;1"/></line><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.50s" fill="freeze"/><text x="18.0" y="387.5" fill="#5d788f" font-size="7" font-weight="400" text-anchor="start" le