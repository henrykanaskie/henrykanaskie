ight="400" text-anchor="start">All figures are read from the GitHub API at build time. Status and completion are hand-set in data/profile.toml and reviewed,</text><text x="45.8" y="78.5" fill="#16202b" font-size="11" font-weight="400" text-anchor="start">not inferred.</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.68s" fill="freeze"/><text x="26.0" y="107.0" fill="#16202b" font-size="11" font-weight="400" text-anchor="start">2.</text><text x="45.8" y="107.0" fill="#16202b" font-size="11" font-weight="400" text-anchor="start">I write the transformer by hand about once a year. It gets less mysterious every time.</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.78s" fill="freeze"/><text x="26.0" y="135.5" fill="#16202b" font-size="11" font-weight="400" text-anchor="start">3.</text><text x="45.8" y="135.5" fill="#16202b" font-size="11" font-weight="400" text-anchor="start">This build degraded 2 telemetry channels; those cells read NO DATA rather than showing stale values.</text></g><line x1="26.0" y1="168.0" x2="874.0" y2="168.0" stroke="#cdc4b4" stroke-width="0.8" stroke-dasharray="848.0" opacity="1.0"><animate attributeName="stroke-dashoffset" from="848.0" to="0" dur="0.8s" begin="0.10s" fill="freeze" calcMode="spline" keySplines="0.3 0.9 0.3 1" keyTimes="0;1"/></line><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.70s" fill="freeze"/><text x="26.0" y="186.0" fill="#8d8577" font-size="6.8" font-weight="400" text-anchor="start" letter-spacing="1.0">GENERATED 2026-08-25 00:14 UTC</text></g></svg>