-size="7" font-weight="400" text-anchor="middle" opacity="0.75">B</text><line x1="0.0" y1="124.0" x2="8.0" y2="124.0" stroke="#cdc4b4" stroke-width="0.7" opacity="0.5"></line><line x1="292.0" y1="124.0" x2="300.0" y2="124.0" stroke="#cdc4b4" stroke-width="0.7" opacity="0.5"></line><rect x="8.5" y="8.5" width="283" height="231" fill="none" stroke="#cdc4b4" stroke-width="1.2"/><path d="M15.0 8.0 L8.0 8.0 L8.0 15.0" fill="none" stroke="#16202b" stroke-width="1.4" opacity="0.55"/><path d="M285.0 8.0 L292.0 8.0 L292.0 15.0" fill="none" stroke="#16202b" stroke-width="1.4" opacity="0.55"/><path d="M15.0 240.0 L8.0 240.0 L8.0 233.0" fill="none" stroke="#16202b" stroke-width="1.4" opacity="0.55"/><path d="M285.0 240.0 L292.0 240.0 L292.0 233.0" fill="none" stroke="#16202b" stroke-width="1.4" opacity="0.55"/><text x="18.0" y="23.0" fill="#8d8577" font-size="8" font-weight="400" text-anchor="start" letter-spacing="1.6">NOTES</text><text x="282.0" y="232.0" fill="#8d8577" font-size="7.5" font-weight="400" text-anchor="end" letter-spacing="1.2">SH 7 / 7</text><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.58s" fill="freeze"/><text x="18.0" y="48.0" fill="#16202b" font-size="9.5" font-weight="400" text-anchor="start">1.</text><text x="35.1" y="48.0" fill="#16202b" font-size="9.5" font-weight="400" text-anchor="start">All figures are read from the GitHub API at</text><text x="35.1" y="61.5" fill="#16202b" font-size="9.5" font-weight="400" text-anchor="start">build time. Status and completion are</text><text x="35.1" y="75.0" fill="#16202b" font-size="9.5" font-weight="400" text-anchor="start">hand-set in data/profile.toml and reviewed,</text><text x="35.1" y="88.5" fill="#16202b" font-size="9.5" font-weight="400" text-anchor="start">not inferred.</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.68s" fill="freeze"/><text x="18.0" y="113.0" fill="#16202b" font-size="9.5" font-weight="400" text-anchor="start">2.</text><text x="35.1" y="113.0" fill="#16202b" font-size="9.5" font-weight="400" text-anchor="start">I write the transformer by hand about once</text><text x="35.1" y="126.5" fill="#16202b" font-size="9.5" font-weight="400" text-anchor="start">a year. It gets less mysterious every time.</text></g><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.78s" fill="freeze"/><text x="18.0" y="151.0" fill="#16202b" font-size="9.5" font-weight="400" text-anchor="start">3.</text><text x="35.1" y="151.0" fill="#16202b" font-size="9.5" font-weight="400" text-anchor="start">This build degraded 2 telemetry channels;</text><text x="35.1" y="164.5" fill="#16202b" font-size="9.5" font-weight="400" text-anchor="start">those cells read NO DATA rather than</text><text x="35.1" y="178.0" fill="#16202b" font-size="9.5" font-weight="400" text-anchor="start">showing stale values.</text></g><line x1="18.0" y1="205.5" x2="282.0" y2="205.5" stroke="#cdc4b4" stroke-width="0.8" stroke-dasharray="264.0" opacity="1.0"><animate attributeName="stroke-dashoffset" from="264.0" to="0" dur="0.8s" begin="0.10s" fill="freeze" calcMode="spline" keySplines="0.3 0.9 0.3 1" keyTimes="0;1"/></line><g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.70s" fill="freeze"/><text x="18.0" y="221.5" fill="#8d8577" font-size="6.6" font-weight="400" text-anchor="start" letter-spacing="0.9">GENERATED 2026-08-25 00:34 UTC</text></g></svg>