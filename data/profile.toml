[bom]
# Draw a red drafting revision cloud around whichever project was pushed to most
# recently. It is real drawing practice and the data behind it is real, but red
# is the loudest mark on the sheet and it moves to a different row every day,
# which reads as an alarm rather than a note. Set true to bring it back.
mark_last_push = false


# ─── NOTES BLOCK ─────────────────────────────────────────────────────────────
#
#  Real drawings carry a numbered notes block. This one is yours to write.
#
#  One of these is drawn at the foot of the GENERAL NOTES sheet each day, under
#  a FIELD NOTE label. One is chosen per day, rotating by date so the same note
#  doesn't sit there for a week.
#
#  Write them the way you'd annotate your own drawing: one fact about the work,
#  stated flat. Not jokes, and not lines meant to be quoted. The test is whether
#  it would still be worth writing down if nobody else read it. Anything that
#  ends on a turn of phrase has been written to be read rather than to record
#  something, and it goes.
#
#  This lives under its own [notes] header rather than as a bare `field_notes`
#  array on purpose. TOML binds a bare key to the table above it, so an array
#  written down here without a header would silently become a field of the last
#  [[projects]] entry and the notes block would render empty. Keep the header.

[notes]
field = [
  "The Bee Atlas records where people went looking, not everywhere bees went. The rankings have to be read with that in mind.",
  "Cap_Match_Net searches E12 values because those are the capacitors the lab stocks.",
  "groupStats can read message text, but it is off by default and every board works the same without it.",
  "aggregateAnalytics writes each week's predictions to a log before kickoff. The log is not committed to the repository yet, which is the next thing to fix.",
  "Ground Control started as a shell script that listed which repositories had uncommitted changes.",
  "animAgent reads hook metadata only. It never sees prompt or response text.",
  "Orchestrate exists because I was retyping the same long prompts into Claude Code for every new project.",
  "floralytics was written by six students for the Oregon Bee Project.",
  "The hardest part of GrowthApp so far has been deciding where a node is allowed to sit.",
  "small-shell was a course project. The signal handling is the part that took the longest.",
]


# ─── SOURCES ─────────────────────────────────────────────────────────────────
#
#  What the build is allowed to go and fetch. Everything here is GitHub's own
#  API about this account: language bytes, push times, and the most recent
#  commit on each project that has a public repository.
#
#  There used to be a daily telemetry sheet on this profile carrying the next
#  orbital launch, how many people were in space, and the ISS ground track. All
#  three were real, live, and correctly attributed, and none of them were about
#  me or anything I made. They came off the drawing set, and so did the launch,
#  crew and ISS channels that fed them.

[sources]
github = true


# ─── FRAMEWORKS ──────────────────────────────────────────────────────────────
#
#  Drawn on sheet 4 as a cross-reference matrix: frameworks down the side, the
#  parts of the bill of materials across the top, a mark where one uses the
#  other. Engineering drawings carry matrices like this because a table of
#  "project X uses A, B, C" hides the thing you actually want, which is the
#  shape of the columns: what recurs, what is used once, and which parts share
#  a stack with which.
#
#  The two bands are the point of the sheet.
#
#    BUNDLED    ships with the platform. SwiftUI is on every Mac; the Node
#               standard library arrives with Node. Using it costs nothing and
#               installs nothing.
#    INSTALLED  you have to go and fetch it, and then keep fetching it. A lock
#               file, a version to pin, a thing that can break on a Tuesday.
#
#  Six of the ten parts have nothing at all in the INSTALLED band, and the sheet
#  does not have to say so in words: those columns are visibly empty. That count
#  is derived from this table, so it cannot drift.
#
#    name     the framework, as it is actually called
#    bundled  true if it ships with the platform, false if it is installed
#    on       parts that use it. Names must match the bill of materials
#
#  ORDER: the bands are drawn in the order the entries appear, bundled first.
#  Within a band, most-used first is the readable order.

[[frameworks]]
name    = "WKWebView"
bundled = true
on      = ["groupStat", "Ground-Control", "orchestrate"]

[[frameworks]]
name    = "Node standard library"
bundled = true
on      = ["Ground-Control", "orchestrate"]

[[frameworks]]
