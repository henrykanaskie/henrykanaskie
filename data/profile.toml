# ─────────────────────────────────────────────────────────────────────────────
#  PROFILE SOURCE OF TRUTH
#
#  This is the only file you need to edit. The README, every SVG card, and the
#  daily telemetry band are all generated from it by scripts/build.py.
#
#  Nothing else in this repository holds project facts. If a project's status is
#  wrong on the profile, it is wrong here and nowhere else.
#
#      python3 scripts/build.py          # regenerate everything locally
#      python3 scripts/build.py --offline  # regenerate without network calls
#
#  TOML because tomllib is in the standard library, so the build has no
#  dependencies to install and no lockfile to drift.
# ─────────────────────────────────────────────────────────────────────────────


[identity]
name       = "Henry Kanaskie"
# The drawing's title block. Keep it short. It is set in caps at a large size.
title      = "MODELS / HARDWARE / THE BOUNDARY BETWEEN"
tagline    = "Machine learning, quantitative research, and things that talk to hardware."
website    = "https://henrykanaskie.com"
github     = "henrykanaskie"
# Sheet metadata. Bump `revision` by hand when you make a change worth marking;
# it is the one number here that is deliberately not automated.
revision   = "F"
drawn_by   = "H. KANASKIE"


[about]
# Prose for the top of the README. Written as a list so the line breaks in the
# file don't become line breaks on the profile. These are joined with spaces.
body = [
  "I work at the boundary between models and hardware. A transformer written",
  "from first principles, an optimizer that picks capacitor values you can",
  "actually buy, a habit tracker that draws your streaks as a neural graph.",
  "Most of it starts as a question I couldn't answer by reading, so I write",
  "the thing that answers it.",
]

# The three lines under the prose. Bold with **, as in normal markdown.
points = [
  "Mostly on **retrieval over code** right now: AST-aware chunking, embeddings, citations that hold up",
  "Just finished **Floralytics**, which factors Oregon's bee-plant records into habitat advice",
  "Happiest in a debugger, at the point where the theory stops matching the trace",
]


# ─── STATUS VOCABULARY ───────────────────────────────────────────────────────
#
#  Status is a band of the completion figure, not a label you set independently,
#  so a CONCEPT can never outrank something in FLIGHT. build.py asserts this:
#
#      CONCEPT < 0.25 <= BREADBOARD < 0.45 <= FLIGHT < 0.90 <= QUALIFIED
#
#  Change a bound here and the check moves with it.

[[status]]
key   = "QUALIFIED"
mark  = "✓"
floor = 0.90
blurb = "built, working, done"

[[status]]
key   = "FLIGHT"
mark  = "▲"
floor = 0.45
blurb = "in active development"

[[status]]
key   = "BREADBOARD"
mark  = "◗"
floor = 0.25
blurb = "assembled, not yet trustworthy"

[[status]]
key   = "CONCEPT"
mark  = "○"
floor = 0.00
blurb = "scaffold and intent"


# ─── BILL OF MATERIALS ───────────────────────────────────────────────────────
#
#  Each project is a part on the drawing. Order here is the order on the sheet.
#
#    pn         reference designator. Drawings key parts by CLASS-NN rather than
#               a bare serial, because the prefix says what a thing is before you
#               read its name. Classes in use, extend freely:
#                 OPT solver / optimizer      SYS systems and OS-level
#                 QNT quantitative research   MDL model built from scratch
#                 APP end-user application    TUL tool for my own use
#                 EDU teaching material
#    name       repository name
#    lang       must appear in [palette.lang] below
#    status     one of the keys above
#    completion 0.0 to 1.0, and must fall inside that status's band
#    summary    one line, shown collapsed. At most 81 characters, which is what
#               the BOM description column holds. Go over and the build fails
#               and tells you by how much, rather than cutting it with an
#               ellipsis.
#    detail     the expanded paragraph
#    notes      tolerance callouts. Short, factual, no more than three
#    repo       omit entirely for a private or unpushed project
#    private    optional note explaining why there is no link

[[projects]]
pn         = "OPT-01"
name       = "Cap_Match_Net"
lang       = "Python"
status     = "QUALIFIED"
completion = 1.00
summary    = "impedance matching solved as a constraint problem, in real component values"
detail     = """
Capacitor matching networks solved with Google OR-Tools. Takes a target impedance \
and returns a network built from components that actually exist in a parts bin, \
rather than the ideal values a textbook would hand you."""
notes      = ["OR-Tools CP-SAT", "E12 series parts only"]
repo       = "https://github.com/henrykanaskie/Cap_Match_Net"

[[projects]]
pn         = "SYS-01"
name       = "small-shell"
lang       = "C"
status     = "QUALIFIED"
completion = 1.00
summary    = "a Unix shell in C: job control, redirection, and the awkward parts of signals"
detail     = """
Job control, I/O redirection, and signal handling, including the parts that only \
start misbehaving once a process is backgrounded and something sends it a SIGTSTP \
at the wrong moment."""
notes      = ["POSIX job control", "SIGTSTP / SIGINT handled"]
repo       = "https://github.com/henrykanaskie/small-shell"

[[projects]]
pn         = "MDL-02"
name       = "floralytics"
lang       = "Python"
status     = "QUALIFIED"
completion = 0.95
summary    = "Oregon bee-plant records, factored into a ranked planting list for a place"
detail     = """
An interactive map over the Oregon Bee Atlas, written with five others for the Oregon \
Bee Project. Observed bee-plant visits become a sparse interaction matrix and a truncated \
SVD fills what nobody recorded, so a county or ecoregion returns a ranked list of plants \
worth putting in the ground rather than only the visits someone happened to write down. \
React front end over a FastAPI backend, downloadable PDF reports, and request guardrails \
so a small host survives a room full of people opening it at once."""
notes      = ["truncated SVD over the Bee Atlas", "React + FastAPI", "six authors"]
repo       = "https://github.com/Kellen-Sullivan/bee-plant-data-exploration"

[[projects]]
pn         = "APP-03"
name       = "acclimate"
lang       = "Python"
status     = "QUALIFIED"
completion = 0.92
summary    = "paste a repository URL, read back an answer that cites its own source lines"
detail     = """
A codebase onboarding assistant, built at BeaverHacks 2026. It clones a public \
repository, splits the code by function and class with tree-sitter rather than by line \
count, embeds it into a local ChromaDB, and answers questions with citations that open \
the exact lines behind them. Four ways in: question and answer, an animated walkthrough \
over a generated component diagram, a multi-tool agent that searches symbols and traces \
dependencies, and a view of everything that depends on one file."""
notes      = ["AST-aware chunking", "every claim cites its lines", "BeaverHacks 2026"]
repo       = "https://github.com/henrykanaskie/beaverhacks26"

[[projects]]
pn         = "APP-01"
name       = "animAgent"
lang       = "Swift"
status     = "FLIGHT"
completion = 0.88
summary    = "Sprite Room: your agents as pixel-art characters, dropping from the notch"
detail     = """
A macOS app that turns live Claude Code activity into a small pixel-art room of \
working characters. Each agent is a character, and each tool call is something it is \
visibly doing. Read-only by design: it never controls an agent and never shows prompt or \
response content. The room is a lattice, so every character stays inside its own \
seat's column. Six themed rooms sit behind a picker."""
notes      = ["M0 through M6 committed", "871 tests / 87 suites green"]
repo       = "https://github.com/henrykanaskie/animAgent"

[[projects]]
pn         = "APP-02"
name       = "GrowthApp"
lang       = "Swift"
status     = "FLIGHT"
completion = 0.62
summary    = "a SwiftUI habit tracker that draws your streaks as a living neural graph"
detail     = """
Each habit is a filament radiating from the center, each kept day a node, the day \
just kept glowing gold. A full WidgetKit suite renders the same sphere held still, \
compiled from code shared with the app and reading one App Group store. Themes and \
board composition are real; every reader choice survives a relaunch."""
notes      = ["full WidgetKit suite", "shared App Group store", "no remote yet"]
private    = "private repository"

[[projects]]
pn         = "TUL-01"
name       = "rLog"
lang       = "Python"
status     = "FLIGHT"
completion = 0.55
summary    = "speak into it, and structured LaTeX comes back out of a schema-bound LLM"
detail     = """
Voice-driven logging. Audio goes in, gets transcribed, an LLM structures it against \
a fixed schema, and LaTeX comes out. CLI and web front ends over one shared store."""
notes      = ["schema-bound output"]
private    = "code is local, the repository is still empty"

[bom]
# Draw a red drafting revision cloud around whichever project was pushed to most
# recently. It is real drawing practice and the data behind it is real, but red is
# the loudest mark on the sheet and it moves to a different row every day, which
# reads as an alarm rather than a note. The telemetry sheet says the same thing
# calmly under LAST CONTACT. Set true to bring it back.
mark_last_push = false


# ─── NOTES BLOCK ─────────────────────────────────────────────────────────────
#
#  Real drawings carry a numbered notes block. This one is yours to write.
#
#  One of these is drawn at the foot of the GENERAL NOTES sheet each day, under
#  a FIELD NOTE label. They are not jokes and should not read as jokes. They are
#  the part of the drawing where a person is obviously behind it. Write them the way
#  you'd annotate your own work: flat, specific, true. One is chosen per day,
#  rotating by date so the same note doesn't sit there for a week.
#
#  Add as many as you like. Nine is not a limit.
#
#  This lives under its own [notes] header rather than as a bare `field_notes`
#  array on purpose. TOML binds a bare key to the table above it, so an array
#  written down here without a header would silently become a field of the last
#  [[projects]] entry and the notes block would render empty. Keep the header.

[notes]
field = [
  "The bee-plant matrix is mostly empty. That is the whole reason the SVD is there: an unrecorded visit is not the same as an absent relationship.",
  "Cap_Match_Net exists because the ideal component values in the textbook aren't in anyone's parts bin.",
  "AccliMate cites the lines it answered from, because an onboarding tool you cannot check is just a confident stranger.",
  "The shell taught me more about signals than any chapter on signals did.",
  "The Bee Atlas is a record of where people went looking, not only of what was there. The recommender has to be read with that in mind.",
  "I write the transformer by hand about once a year. It gets less mysterious every time.",
  "The pixel-art agents are read-only on purpose. Watching is the whole feature.",
  "A lot of Sprite Room's tests turned out to be about where a character is allowed to stand. I did not expect that to be the hard part.",
]


# ─── TELEMETRY CHANNELS ──────────────────────────────────────────────────────
#
#  The daily band. Every channel degrades to a dashed "NO DATA" cell rather than
#  failing the build. An unreachable API must never break the profile.

[telemetry]
# Next orbital launch worldwide, with a live countdown. thespacedevs, no key.
launch_window   = true
# How many people are off the planet right now. thespacedevs, no key.
humans_in_space = true
# ISS sub-satellite point, sampled at build time and stamped with that time.
iss_track       = true
# Your own push activity, read from the GitHub API.
repo_telemetry  = true

[telemetry.listening]
# OFF until you add the key. See SETUP.md. It takes about two minutes and it is
# the only part of this build that needs a secret.
#
#   provider = "lastfm", user = your Last.fm username,
#   and a LASTFM_API_KEY repository secret.
enabled  = false
provider = "lastfm"
user     = ""


# ─── FOCUS AREAS ─────────────────────────────────────────────────────────────
#  Order is the order they're laid out in. Colour comes from the palette below.
#  Under its own header for the same reason as [notes] above.

[focus]
areas = [
  "machine learning", "transformers", "quantitative research", "time series",
  "optimization", "embedded C", "signal processing", "SwiftUI", "agents",
  "numerical methods",
]


# ─── PALETTE ─────────────────────────────────────────────────────────────────
#
#  Linguist's own colours are not a palette: they were picked per language in
#  isolation, so Python (#3572A5) and TypeScript (#3178c6) are the same blue and
#  a stacked bar reads as one undifferentiated block, while C (#555555) is a
#  muddy grey. These are categorical slots checked for separation against both
#  sheet grounds. Each language gets [light, dark], and the dark value is stepped
#  for the dark ground rather than lightened from the light one.

[palette.lang]
Python     = ["#2a78d6", "#3987e5"]
C          = ["#eb6834", "#d95926"]
TypeScript = ["#1baf7a", "#199e70"]
JavaScript = ["#eda100", "#c98500"]
Swift      = ["#e87ba4", "#d55181"]
Shell      = ["#008300", "#3ea33e"]
R          = ["#4a3aa7", "#9085e9"]
"C++"      = ["#e34948", "#e66767"]

# Anything not named above falls through to these, in order.
spare = [["#7a6ff0", "#9a92f5"], ["#00868b", "#2aa6ab"]]


[languages]
# How the mix is counted. Two honest answers to different questions:
#
#   "equal"  one repo, one vote. Each repo contributes its own percentage
#            breakdown and those are averaged. Says what you reach for.
#   "bytes"  one byte, one vote. Says where the code physically is.
#
# The gap is large. Measured 2026-08-24, equal gives Python 64.7% and Swift 7.9%;
# bytes gives Python 23.3% and Swift 49.4%, and C drops from 9.1% to 0.2%. The
# composition card states which one is in force, so either is defensible.
weighting = "equal"

# Languages that are markup, styling, or generated rather than written.
exclude = ["CSS", "HTML"]
# A repo with fewer than this many bytes is a placeholder, not a project.
min_bytes = 500
# Below this share a bar segment is a sub-pixel sliver and a legend row of noise.
min_share = 0.01
# Most-used languages shown on the composition card.
show = 6
