# ─────────────────────────────────────────────────────────────────────────────
#  PROFILE SOURCE OF TRUTH
#
#  This is the only file you need to edit. The README and every SVG card are
#  generated from it by scripts/build.py.
#
#  Nothing else in this repository holds project facts. If a project's status is
#  wrong on the profile, it is wrong here and nowhere else.
#
#      python3 scripts/build.py            # regenerate everything locally
#      python3 scripts/build.py --offline  # regenerate without network calls
#
#  TOML because tomllib is in the standard library, so the build has no
#  dependencies to install and no lockfile to drift.
#
#  THE RULE FOR THIS FILE: every field on every sheet has to be something a
#  stranger could check. No field exists because a drawing usually has one. If
#  a value would have to be invented to fill a box, the box comes off the sheet.
# ─────────────────────────────────────────────────────────────────────────────


[identity]
name     = "Henry Kanaskie"
# The drawing's title block. Set in caps at a large size, so keep it short.
# It names the subject matter, not a self-description.
title    = "MACHINE LEARNING · SIGNAL PROCESSING · TOOLS I USE MYSELF"
tagline  = "What I have built, what each one does, and why I built it."
website  = "https://henrykanaskie.com"
github   = "henrykanaskie"

# The two fields in the title block strip that a build cannot derive. Everything
# else in that strip (project counts, last push, build date) is measured.
status   = "MS STUDENT, OREGON STATE"
location = "CORVALLIS, OREGON"


[about]
# Prose for the general notes sheet. Written as a list so the line breaks in the
# file don't become line breaks on the profile. These are joined with spaces.
body = [
  "I'm a computer science student at Oregon State, working on a master's after",
  "finishing my undergrad there. Two of the projects below came out of research",
  "in the plasma lab: a solver that picks capacitor values for RF matching",
  "networks, and signal processing for thruster data. The rest I wrote for",
  "myself, because I wanted to use them. Each row of the bill of materials says",
  "what a project does, and the entry under it says why I wrote it.",
]

# The three lines under the prose. Bold with **, as in normal markdown.
points = [
  "Master's in CS at **Oregon State**. Two years of undergrad research in the plasma lab before that",
  "Six months at **DZYNE Technologies**, writing embedded C and C++ and the Python test framework around it",
  "Outside of school: photography, skiing, lifting",
]


# ─── STATUS VOCABULARY ───────────────────────────────────────────────────────
#
#  Status is a band of the completion figure, not a label you set independently,
#  so a CONCEPT can never outrank something in FLIGHT. build.py asserts this:
#
#      CONCEPT < 0.25 <= BREADBOARD < 0.45 <= FLIGHT < 0.95 <= QUALIFIED
#
#  Change a bound here and the check moves with it.
#
#  The QUALIFIED floor is 0.95 and not 0.90 on purpose. Two projects here sit at
#  exactly 0.90, which is the number I would give someone who asked, and it is
#  not the same claim as "done". A vocabulary that rounds 90% up to DONE is a
#  vocabulary that cannot be trusted on the rows where it says DONE.

[[status]]
key   = "QUALIFIED"
mark  = "✓"
floor = 0.95
blurb = "built, working, done"

[[status]]
key   = "FLIGHT"
mark  = "▲"
floor = 0.45
blurb = "in active development"

[[status]]
key   = "BREADBOARD"
mark  = "◗"
floor = 0.25
blurb = "assembled, not yet trustworthy"

[[status]]
key   = "CONCEPT"
mark  = "○"
floor = 0.00
blurb = "scaffold and intent"


# ─── BILL OF MATERIALS ───────────────────────────────────────────────────────
#
#  Each project is a part on the drawing. Order here is the order on the sheet.
#
#    pn         reference designator. Drawings key parts by CLASS-NN rather than
#               a bare serial, because the prefix says what a thing is before you
#               read its name. Classes in use, extend freely:
#                 OPT solver / optimizer      SYS systems and OS-level
#                 QNT quantitative research   MDL model built from scratch
#                 APP end-user application    TUL tool for my own use
#                 EDU teaching material
#    name       repository name
#    lang       must appear in [palette.lang] below
#    status     one of the keys above
#    completion 0.0 to 1.0, and must fall inside that status's band
#    description
#               One or two sentences: what the thing does and what it is useful
#               for, written as prose rather than as two fields. Up to three
#               lines in the bill of materials' description column, which the
#               build measures against the real column width and rejects if it
#               overflows.
#
#               This was briefly a terse `summary` plus a separate `why`, and
#               the pair read like a spec sheet: a clipped noun phrase, then a
#               sentence beginning "useful because". Splitting a description
#               into what-it-does and what-it-is-for is a shape no person
#               writing about their own project would choose.
#
#               Before that it was `summary` plus a `detail` paragraph that was
#               rendered on nothing at all, which is the worse failure of the
#               two: not a sheet saying something untrue, but the file holding
#               ten paragraphs no sheet ever carried.
#    notes      tolerance callouts. Short, factual, no more than three
#    repo       omit entirely for a private or unpushed project
#    private    optional note explaining why there is no link
#
#  What a part is built ON is not here. It lives in [[frameworks]] below, keyed
#  the other way round: one entry per framework, listing the parts that use it.
#  That direction is the one the matrix on sheet 4 is drawn from, and keeping a
#  second copy per project would only be a second thing to forget to update.

[[projects]]
pn         = "OPT-01"
name       = "Cap_Match_Net"
lang       = "Python"
status     = "QUALIFIED"
completion = 1.00
description = "Picks the capacitor values for an RF impedance matching network, searching only over parts the lab stocks, so the network it hands back can be built as-is instead of rounded to the nearest real value and checked again."
notes      = ["OR-Tools CP-SAT", "E12 series parts only"]
repo       = "https://github.com/henrykanaskie/Cap_Match_Net"

[[projects]]
pn         = "SYS-01"
name       = "small-shell"
lang       = "C"
status     = "QUALIFIED"
completion = 1.00
description = "A Unix shell in C with job control, I/O redirection and signal handling. It is the smallest complete example I have of how a shell hands the terminal to a process group and takes it back, which is the part most write-ups skip."
notes      = ["POSIX job control", "SIGTSTP and SIGINT handled", "operating systems course"]
repo       = "https://github.com/henrykanaskie/small-shell"

[[projects]]
pn         = "MDL-02"
name       = "floralytics"
lang       = "Python"
status     = "QUALIFIED"
completion = 1.00
description = "Ranks the plants worth planting in a given county from the visits recorded in the Oregon Bee Atlas, turning a statewide dataset into an answer for one place. A restoration planner gets a list for where they are planting, not a general guide."
notes      = ["truncated SVD over the Bee Atlas", "React + FastAPI", "six authors"]
repo       = "https://github.com/Kellen-Sullivan/bee-plant-data-exploration"

[[projects]]
pn         = "APP-03"
name       = "accliMate"
lang       = "Python"
status     = "QUALIFIED"
completion = 1.00
description = "Answers questions about a codebase you have never seen, linking the lines each answer came from so you can check it rather than trust it. A dependency view covers the other day-one question: what else uses the file you are changing."
notes      = ["AST-aware chunking", "every answer cites its lines", "BeaverHacks 2026"]
repo       = "https://github.com/henrykanaskie/accliMate"

[[projects]]
pn         = "APP-01"
name       = "animAgent"
lang       = "Swift"
status     = "QUALIFIED"
completion = 1.00
description = "Shows the Claude Code agents you have running as characters in a pixel-art room, so one glance says whether they are working or waiting on you. It reads hook metadata only and cannot touch an agent, so it is safe to leave open beside them."
notes      = ["reads hook metadata only", "871 tests / 87 suites green"]
repo       = "https://github.com/henrykanaskie/animAgent"

[[projects]]
pn         = "TUL-02"
name       = "groupStat"
lang       = "Python"
status     = "QUALIFIED"
completion = 1.00
description = "Counts the tapbacks in a macOS Messages database and ranks a group chat eight ways, settling the argument with what people reacted to rather than what anyone remembers. It works on a copy and makes no outbound requests of any kind."
notes      = ["reads a copy, not the live one", "bodies off by default", "standard library only"]
private    = "private repository"

[[projects]]
pn         = "TUL-03"
name       = "Ground-Control"
lang       = "JavaScript"
status     = "FLIGHT"
completion = 0.90
description = "Lists every repository on my disk with its git state, whether an agent is running in it, and its onboarding document. It replaces cd-ing through twenty folders running git status, and says what a project was when I come back to it cold."
