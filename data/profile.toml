[bom]
# Draw a red drafting revision cloud around whichever project was pushed to most
# recently. It is real drawing practice and the data behind it is real, but red
# is the loudest mark on the sheet and it moves to a different row every day,
# which reads as an alarm rather than a note. Set true to bring it back.
mark_last_push = false


# ─── NOTES BLOCK ─────────────────────────────────────────────────────────────
#
#  Real drawings carry a numbered notes block. This one is yours to write.
#
#  One of these is drawn at the foot of the GENERAL NOTES sheet each day, under
#  a FIELD NOTE label. They are not jokes and should not read as jokes. They are
#  the part of the drawing where a person is obviously behind it. Write them the
#  way you'd annotate your own work: flat, specific, true. One is chosen per day,
#  rotating by date so the same note doesn't sit there for a week.
#
#  This lives under its own [notes] header rather than as a bare `field_notes`
#  array on purpose. TOML binds a bare key to the table above it, so an array
#  written down here without a header would silently become a field of the last
#  [[projects]] entry and the notes block would render empty. Keep the header.

[notes]
field = [
  "Cap_Match_Net exists because the component values in the textbook aren't the ones in anybody's parts bin.",
  "Ground Control started as a shell script that told me which repos had uncommitted changes. It got away from me.",
  "The shell taught me more about signals than the chapter on signals did.",
  "The bee-plant matrix is mostly empty, and that is the whole reason the SVD is there. Nobody recording a visit is not the same as the visit not happening.",
  "The Bee Atlas records where people went looking, not only what was there. Any recommendation off it has to be read that way.",
  "The NFL model commits its predictions before kickoff. A track record you could have backfilled is not a track record.",
  "groupStats counts reactions and does not read the messages. That limit cost the one feature that needed the words, which felt like the right trade.",
  "Almost everything here started as something I wanted to use myself. That is the only reason any of it got finished.",
  "The pixel-art agent room is read-only. Watching is the feature, and giving it control would have made it something I'd have to trust.",
  "Most of a week on GrowthApp went into where a node is allowed to sit. I did not expect that to be the hard part.",
]


# ─── SOURCES ─────────────────────────────────────────────────────────────────
#
#  What the build is allowed to go and fetch. Everything here is GitHub's own
#  API about this account: language bytes, push times, and the most recent
#  commit on each project that has a public repository.
#
#  There used to be a daily telemetry sheet on this profile carrying the next
#  orbital launch, how many people were in space, and the ISS ground track. All
#  three were real, live, and correctly attributed, and none of them were about
#  me or anything I made. They came off the drawing set. What replaced them is
#  the timeline sheet, which is drawn from the commit history of the parts on
#  the bill of materials.

[sources]
github = true


# ─── TIMELINE ────────────────────────────────────────────────────────────────
#
#  The timeline sheet draws each part of the bill of materials as a bar running
#  from its first commit to its most recent one.
#
#  `started`, `last` and `commits` on each project are the authority, and they
#  are read off real git history rather than estimated. For a project with a
#  public repository the build refreshes `last` from the live push time, so an
#  active bar keeps growing without an edit here. A private project has no live
#  source, so the file's date is the one that gets drawn and it is only as
#  current as the last time it was updated by hand.
#
#  A project whose whole history landed on one day draws as a milestone diamond
#  rather than a hairline bar. Cap_Match_Net and small-shell are both like this:
#  the work happened over months in a lab and a course, and then went to GitHub
#  in a single push. A bar one day wide would be a true statement about the
#  repository and a false one about the work, so it gets the mark a drawing uses
#  for a thing with a date and no duration.

[timeline]
# Months of history to draw. Older parts are clamped to the left edge with an
# open end, the way a Gantt chart shows a task that starts before the window.
months = 14
# Refresh `last` from the live GitHub push time where the repository is public.
follow_pushes = true


# ─── TOOLBOX ─────────────────────────────────────────────────────────────────
#
#  What I actually reach for, and what for. One row per tool.
#
#  The rule for this table is that `for` says what the tool does in MY work, not
#  what the tool is. Anyone can read what Python is. The row earns its place by
#  saying which of these projects would not exist without it.
#
#    name   the tool
#    for    what I use it for, in one line
#    on     projects it is used on. Names must match the bill of materials
#           above, or the build tells you which one is a typo
#    lang   optional. When set, the row gets the same hatch swatch and colour
#           that language carries on the composition sheet, so the two sheets
#           agree about what colour Python is

[[tools]]
name = "Python"
for  = "models, data pipelines, and anything that ends in a number I have to trust"
on   = ["aggregateAnalytics", "floralytics", "Cap_Match_Net"]
lang = "Python"

[[tools]]
name = "C / C++"
for  = "embedded work and the OS-level projects, where the details are the point"
on   = ["small-shell"]
lang = "C"

[[tools]]
name = "Swift / SwiftUI"
for  = "native macOS and iOS apps, and the small app shells I wrap servers in"
on   = ["animAgent", "GrowthApp", "groupStat"]
lang = "Swift"

[[tools]]
name = "Node, no deps"
for  = "local dashboards that have to still run in a year with no install step"
on   = ["Ground-Control", "orchestrate"]
lang = "JavaScript"

[[tools]]
name = "OR-Tools"
for  = "constraint problems where the answer has to be a part you can order"
on   = ["Cap_Match_Net"]

[[tools]]
name = "polars"
for  = "season-scale football data, because pandas was the slow half of the loop"
on   = ["aggregateAnalytics"]

[[tools]]
name = "tree-sitter"
for  = "splitting code by function and class instead of by line count"
on   = ["accliMate"]

[[tools]]
name = "MATLAB"
for  = "plasma thruster signal processing in the lab, and only in the lab"
on   = []

[[tools]]
name = "VHDL"
for  = "FPGA modules for reading sensors nobody could measure before"
on   = []


# ─── FOCUS AREAS ─────────────────────────────────────────────────────────────
#  Order is the order they're laid out in. Under its own header for the same
#  reason as [notes] above.

[focus]
areas = [
  "machine learning", "signal processing", "embedded C", "optimization",
  "time series", "FPGA / VHDL", "SwiftUI", "agents", "data pipelines",
]


# ─── PALETTE ─────────────────────────────────────────────────────────────────
#
#  Linguist's own colours are not a palette: they were picked per language in
#  isolation, so Python (#3572A5) and TypeScript (#3178c6) are the same blue and
#  a stacked bar reads as one undifferentiated block, while C (#555555) is a
#  muddy grey. These are categorical slots checked for separation against both
#  sheet grounds. Each language gets [light, dark], and the dark value is stepped
#  for the dark ground rather than lightened from the light one.

[palette.lang]
Python     = ["#2a78d6", "#3987e5"]
C          = ["#eb6834", "#d95926"]
TypeScript = ["#1baf7a", "#199e70"]
JavaScript = ["#eda100", "#c98500"]
Swift      = ["#e87ba4", "#d55181"]
Shell      = ["#008300", "#3ea33e"]
R          = ["#4a3aa7", "#9085e9"]
"C++"      = ["#e34948", "#e66767"]

# Anything not named above falls through to these, in order.
spare = [["#7a6ff0", "#9a92f5"], ["#00868b", "#2aa6ab"]]


[languages]
# How the mix is counted. Two honest answers to different questions:
#
#   "equal"  one repo, one vote. Each repo contributes its own percentage
#            breakdown and those are averaged. Says what you reach for.
#   "bytes"  one byte, one vote. Says where the code physically is.
#
# The gap is large. Measured 2026-08-24, equal gives Python 64.7% and Swift 7.9%;
# bytes gives Python 23.3% and Swift 49.4%, and C drops from 9.1% to 0.2%. The
# composition card states which one is in force, so either is defensible.
weighting = "equal"

# Languages that are markup, styling, or generated rather than written.
exclude = ["CSS", "HTML"]
# A repo with fewer than this many bytes is a placeholder, not a project.
min_bytes = 500
# Below this share a bar segment is a sub-pixel sliver and a legend row of noise.
min_share = 0.01
# Most-used languages shown on the composition card.
show = 6
