lang       = "Python"
status     = "QUALIFIED"
completion = 1.00
summary    = "Picks capacitor values for an RF impedance matching network"
why        = "The network it returns is buildable from stocked parts, so nothing has to be rounded afterwards and re-checked to see whether it still matches."
notes      = ["OR-Tools CP-SAT", "E12 series parts only"]
repo       = "https://github.com/henrykanaskie/Cap_Match_Net"

[[projects]]
