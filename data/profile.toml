name       = "orchestrate"
lang       = "JavaScript"
status     = "FLIGHT"
completion = 0.90
description = "Runs a team of Claude Code agents at a project as a dependency graph, starting each one when its upstream reports land. What it saves is the scheduling: the whole pass runs in the right order without me holding the pipeline in my head."
