# ─────────────────────────────────────────────────────────────────────────────
#  PROFILE SOURCE OF TRUTH
#
#  This is the only file you need to edit. The README and every SVG card are
#  generated from it by scripts/build.py.
#
#  Nothing else in this repository holds project facts. If a project's status is
#  wrong on the profile, it is wrong here and nowhere else.
#
#      python3 scripts/build.py            # regenerate everything locally
#      python3 scripts/build.py --offline  # regenerate without network calls
#
#  TOML because tomllib is in the standard library, so the build has no
#  dependencies to install and no lockfile to drift.
#
#  THE RULE FOR THIS FILE: every field on every sheet has to be something a
#  stranger could check. No field exists because a drawing usually has one. If
#  a value would have to be invented to fill a box, the box comes off the sheet.
# ─────────────────────────────────────────────────────────────────────────────


[identity]
name     = "Henry Kanaskie"
# The drawing's title block. Set in caps at a large size, so keep it short.
# It names the subject matter, not a self-description.
title    = "MACHINE LEARNING · SIGNAL PROCESSING · TOOLS I USE MYSELF"
tagline  = "What I have built, what each one does, and why I built it."
website  = "https://henrykanaskie.com"
github   = "henrykanaskie"

# The two fields in the title block strip that a build cannot derive. Everything
# else in that strip (project counts, last push, build date) is measured.
status   = "MS STUDENT, OREGON STATE"
location = "CORVALLIS, OREGON"


[about]
# Prose for the general notes sheet. Written as a list so the line breaks in the
# file don't become line breaks on the profile. These are joined with spaces.
body = [
  "I'm a computer science student at Oregon State, working on a master's after",
  "finishing my undergrad there. Two of the projects below came out of research",
  "in the plasma lab: a solver that picks capacitor values for RF matching",
  "networks, and signal processing for thruster data. The rest I wrote for",
  "myself, because I wanted to use them. Each row of the bill of materials says",
  "what a project does, and the entry under it says why I wrote it.",
]

# The three lines under the prose. Bold with **, as in normal markdown.
points = [
  "Master's in CS at **Oregon State**. Two years of undergrad research in the plasma lab before that",
  "Six months at **DZYNE Technologies**, writing embedded C and C++ and the Python test framework around it",
  "Outside of school: photography, skiing, lifting",
]


# ─── STATUS VOCABULARY ───────────────────────────────────────────────────────
#
#  Status is a band of the completion figure, not a label you set independently,
#  so a CONCEPT can never outrank something in FLIGHT. build.py asserts this:
#
#      CONCEPT < 0.25 <= BREADBOARD < 0.45 <= FLIGHT < 0.95 <= QUALIFIED
#
#  Change a bound here and the check moves with it.
#
#  The QUALIFIED floor is 0.95 and not 0.90 on purpose. Two projects here sit at
#  exactly 0.90, which is the number I would give someone who asked, and it is
#  not the same claim as "done". A vocabulary that rounds 90% up to DONE is a
#  vocabulary that cannot be trusted on the rows where it says DONE.

[[status]]
key   = "QUALIFIED"
mark  = "✓"
floor = 0.95
blurb = "built, working, done"

[[status]]
key   = "FLIGHT"
mark  = "▲"
floor = 0.45
blurb = "in active development"

[[status]]
key   = "BREADBOARD"
mark  = "◗"
floor = 0.25
blurb = "assembled, not yet trustworthy"

[[status]]
key   = "CONCEPT"
mark  = "○"
floor = 0.00
blurb = "scaffold and intent"


# ─── BILL OF MATERIALS ───────────────────────────────────────────────────────
#
#  Each project is a part on the drawing. Order here is the order on the sheet.
#
#    pn         reference designator. Drawings key parts by CLASS-NN rather than
#               a bare serial, because the prefix says what a thing is before you
#               read its name. Classes in use, extend freely:
#                 OPT solver / optimizer      SYS systems and OS-level
#                 QNT quantitative research   MDL model built from scratch
#                 APP end-user application    TUL tool for my own use
#                 EDU teaching material
#    name       repository name
#    lang       must appear in [palette.lang] below
#    status     one of the keys above
#    completion 0.0 to 1.0, and must fall inside that status's band
#    summary    one line, shown collapsed. At most 81 characters, which is what
#               the BOM description column holds. Go over and the build fails
#               and tells you by how much, rather than cutting it with an
#               ellipsis.
#    detail     the expanded paragraph
#    notes      tolerance callouts. Short, factual, no more than three
#    repo       omit entirely for a private or unpushed project
#    private    optional note explaining why there is no link
#
#  What a part is built ON is not here. It lives in [[frameworks]] below, keyed
#  the other way round: one entry per framework, listing the parts that use it.
#  That direction is the one the matrix on sheet 4 is drawn from, and keeping a
#  second copy per project would only be a second thing to forget to update.

[[projects]]
pn         = "OPT-01"
name       = "Cap_Match_Net"
lang       = "Python"
status     = "QUALIFIED"
completion = 1.00
summary    = "Picks capacitor values for an RF impedance matching network"
detail     = """
Takes a target impedance and returns a network of capacitors that reaches it, restricted to values that exist in the E12 series rather than the exact numbers the math gives you. Google OR-Tools solves it as a constraint problem. I wrote it for the plasma lab, where the matching network was being tuned by hand."""
notes      = ["OR-Tools CP-SAT", "E12 series parts only"]
repo       = "https://github.com/henrykanaskie/Cap_Match_Net"

[[projects]]
pn         = "SYS-01"
name       = "small-shell"
lang       = "C"
status     = "QUALIFIED"
completion = 1.00
summary    = "A Unix shell in C: job control, I/O redirection, and signal handling"
detail     = """
Runs commands, handles pipes and I/O redirection, moves jobs between the foreground and the background, and handles SIGINT and SIGTSTP. Written for the operating systems course. I had not understood process groups from the reading, and writing the shell was what made them make sense."""
notes      = ["POSIX job control", "SIGTSTP / SIGINT handled"]
repo       = "https://github.com/henrykanaskie/small-shell"

[[projects]]
pn         = "MDL-02"
name       = "floralytics"
lang       = "Python"
status     = "QUALIFIED"
completion = 1.00
summary    = "Ranks plants for a county from Oregon Bee Atlas visit records"
detail     = """
An interactive map over the Oregon Bee Atlas. Recorded bee visits to plants form a sparse matrix, and a truncated SVD estimates the entries nobody recorded, so asking about a county or an ecoregion returns a ranked list of plants. React front end, FastAPI backend, and downloadable PDF reports. Written with five other students for the Oregon Bee Project, who wanted the Atlas usable by people planning habitat restoration."""
notes      = ["truncated SVD over the Bee Atlas", "React + FastAPI", "six authors"]
repo       = "https://github.com/Kellen-Sullivan/bee-plant-data-exploration"

[[projects]]
pn         = "APP-03"
name       = "accliMate"
lang       = "Python"
status     = "QUALIFIED"
completion = 1.00
summary    = "Answers questions about a codebase and links the lines it read"
detail     = """
Clones a public repository, splits the code into functions and classes with tree-sitter, embeds it into a local ChromaDB, and answers questions with links to the lines it used. It also generates a component diagram, traces what depends on a given file, and searches symbols. Built over a weekend at BeaverHacks 2026, \
for the problem of being dropped into a large codebase and not knowing \
where anything is."""
notes      = ["AST-aware chunking", "every answer cites its lines", "BeaverHacks 2026"]
repo       = "https://github.com/henrykanaskie/accliMate"

[[projects]]
pn         = "APP-01"
name       = "animAgent"
lang       = "Swift"
status     = "QUALIFIED"
completion = 1.00
summary    = "Shows running Claude Code agents as characters in a pixel-art room"
detail     = """
Claude Code hooks POST to a listener running inside the app. Each session becomes a character in a pixel-art room and each tool call becomes something that character is doing. It reads hook metadata only: never prompt text, never response text, and it cannot control an agent. I run several agents at once and had no way to see what they were doing without reading log files."""
notes      = ["reads hook metadata only", "871 tests / 87 suites green"]
repo       = "https://github.com/henrykanaskie/animAgent"

[[projects]]
pn         = "TUL-02"
name       = "groupStat"
lang       = "Python"
status     = "QUALIFIED"
completion = 1.00
summary    = "Counts iMessage tapbacks and ranks a group chat eight ways"
detail     = """
Copies the macOS Messages database, counts the tapbacks that are still standing, and ranks everyone in a group chat eight ways: who receives the most of each reaction, and who gives the most. Python standard library only, in a WKWebView with a server on localhost and no outbound requests. Message text is off by default, because counting reactions does not need it. I wrote it for my group chat."""
notes      = ["reads a copy, never the live database", "message bodies off by default"]
private    = "private repository"

[[projects]]
pn         = "TUL-03"
name       = "Ground-Control"
lang       = "JavaScript"
status     = "FLIGHT"
completion = 0.90
summary    = "Lists every repo on my disk and what state each one is in"
detail     = """
Point it at a folder of repositories and it lists each project with its git state, whether a coding agent is running in it, and its onboarding document. It can write that document, open a project in an editor, and clear out folders that came to nothing. Node standard library, no install step, in a Swift WKWebView wrapper. I had more project folders than I could keep track of."""
notes      = ["Node standard library, no install step", "Swift app shell"]
repo       = "https://github.com/henrykanaskie/Ground-Control"

[[projects]]
pn         = "TUL-04"
name       = "orchestrate"
lang       = "JavaScript"
status     = "FLIGHT"
completion = 0.90
summary    = "Runs a team of Claude Code agents at a project as a dependency graph"
detail     = """
Eight teams of agents, thirty-five roles between them, pointed at whatever project the dashboard is open on. Each team is a dependency graph rather than a list, so an agent starts once its upstream reports land, and the graph is drawn while it runs. It calls the local claude CLI. I was retyping the same long prompts into Claude Code for every new project."""
notes      = ["35 agents across 8 teams", "calls the local claude CLI"]
private    = "private repository"

[[projects]]
pn         = "APP-02"
name       = "GrowthApp"
lang       = "Swift"
status     = "FLIGHT"
completion = 0.62
summary    = "A habit tracker that draws each streak as a filament of a graph"
detail     = """
Each habit is a filament running out from the centre of a sphere, and each day you keep it is a node on that filament. A WidgetKit suite draws the same sphere from code shared with the app, reading one App Group store. Themes and board layout persist across launches. I wanted a habit tracker that showed more \
than a row of checkmarks."""
notes      = ["full WidgetKit suite", "shared App Group store", "no sync yet"]
private    = "private repository"

[[projects]]
pn         = "QNT-01"
name       = "aggregateAnalytics"
lang       = "Python"
status     = "FLIGHT"
completion = 0.60
summary    = "An Elo model for NFL games, with each week's predictions logged"
detail     = """
A margin-aware Elo rating carried across seasons, fitted on games back to 2020 and used to predict the current week. Logging a slate writes each prediction to a parquet file along with the parameters that produced it. A separate dashboard covers player props. I wrote it to find out whether the model is any good, which needs predictions that cannot be edited after the result is known. The log is not committed to the repository yet, so for now it only exists on my laptop."""
notes      = ["log not committed yet", "111 tests", "walk-forward, not backfit"]
repo       = "https://github.com/henrykanaskie/aggregateAnalytics"

[bom]
# Draw a red drafting revision cloud around whichever project was pushed to most
# recently. It is real drawing practice and the data behind it is real, but red
# is the loudest mark on the sheet and it moves to a different row every day,
# which reads as an alarm rather than a note. Set true to bring it back.
mark_last_push = false


# ─── NOTES BLOCK ─────────────────────────────────────────────────────────────
#
#  Real drawings carry a numbered notes block. This one is yours to write.
#
#  One of these is drawn at the foot of the GENERAL NOTES sheet each day, under
#  a FIELD NOTE label. One is chosen per day, rotating by date so the same note
#  doesn't sit there for a week.
#
#  Write them the way you'd annotate your own drawing: one fact about the work,
#  stated flat. Not jokes, and not lines meant to be quoted. The test is whether
#  it would still be worth writing down if nobody else read it. Anything that
#  ends on a turn of phrase has been written to be read rather than to record
#  something, and it goes.
#
#  This lives under its own [notes] header rather than as a bare `field_notes`
#  array on purpose. TOML binds a bare key to the table above it, so an array
#  written down here without a header would silently become a field of the last
#  [[projects]] entry and the notes block would render empty. Keep the header.

[notes]
field = [
  "The Bee Atlas records where people went looking, not everywhere bees went. The rankings have to be read with that in mind.",
  "Cap_Match_Net searches E12 values because those are the capacitors the lab stocks.",
  "groupStats can read message text, but it is off by default and every board works the same without it.",
  "aggregateAnalytics writes each week's predictions to a log before kickoff. The log is not committed to the repository yet, which is the next thing to fix.",
  "Ground Control started as a shell script that listed which repositories had uncommitted changes.",
  "animAgent reads hook metadata only. It never sees prompt or response text.",
  "Orchestrate exists because I was retyping the same long prompts into Claude Code for every new project.",
  "floralytics was written by six students for the Oregon Bee Project.",
  "The hardest part of GrowthApp so far has been deciding where a node is allowed to sit.",
  "small-shell was a course project. The signal handling is the part that took the longest.",
]


# ─── SOURCES ─────────────────────────────────────────────────────────────────
#
#  What the build is allowed to go and fetch. Everything here is GitHub's own
#  API about this account: language bytes, push times, and the most recent
#  commit on each project that has a public repository.
#
#  There used to be a daily telemetry sheet on this profile carrying the next
#  orbital launch, how many people were in space, and the ISS ground track. All
#  three were real, live, and correctly attributed, and none of them were about
#  me or anything I made. They came off the drawing set, and so did the launch,
#  crew and ISS channels that fed them.

[sources]
github = true


# ─── FRAMEWORKS ──────────────────────────────────────────────────────────────
#
#  Drawn on sheet 4 as a cross-reference matrix: frameworks down the side, the
#  parts of the bill of materials across the top, a mark where one uses the
#  other. Engineering drawings carry matrices like this because a table of
#  "project X uses A, B, C" hides the thing you actually want, which is the
#  shape of the columns: what recurs, what is used once, and which parts share
#  a stack with which.
#
#  The two bands are the point of the sheet.
#
#    BUNDLED    ships with the platform. SwiftUI is on every Mac; the Node
#               standard library arrives with Node. Using it costs nothing and
#               installs nothing.
#    INSTALLED  you have to go and fetch it, and then keep fetching it. A lock
#               file, a version to pin, a thing that can break on a Tuesday.
#
#  Six of the ten parts have nothing at all in the INSTALLED band, and the sheet
#  does not have to say so in words: those columns are visibly empty. That count
#  is derived from this table, so it cannot drift.
#
#    name     the framework, as it is actually called
#    bundled  true if it ships with the platform, false if it is installed
#    on       parts that use it. Names must match the bill of materials
#
#  ORDER: the bands are drawn in the order the entries appear, bundled first.
#  Within a band, most-used first is the readable order.

[[frameworks]]
name    = "WKWebView"
bundled = true
on      = ["groupStat", "Ground-Control", "orchestrate"]

[[frameworks]]
name    = "Node standard library"
bundled = true
on      = ["Ground-Control", "orchestrate"]

[[frameworks]]
name    = "Python standard library"
bundled = true
on      = ["groupStat"]

[[frameworks]]
name    = "SwiftUI"
bundled = true
on      = ["GrowthApp"]

[[frameworks]]
name    = "SwiftData"
bundled = true
on      = ["GrowthApp"]

[[frameworks]]
name    = "WidgetKit"
bundled = true
on      = ["GrowthApp"]

[[frameworks]]
name    = "AppKit"
bundled = true
on      = ["animAgent"]

[[frameworks]]
name    = "SpriteKit"
bundled = true
on      = ["animAgent"]

[[frameworks]]
name    = "POSIX / libc"
bundled = true
on      = ["small-shell"]

[[frameworks]]
name    = "FastAPI"
bundled = false
on      = ["floralytics", "accliMate", "aggregateAnalytics"]

[[frameworks]]
name    = "NumPy"
bundled = false
on      = ["floralytics", "aggregateAnalytics"]

[[frameworks]]
