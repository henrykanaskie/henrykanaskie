# ─── TOOLBOX ─────────────────────────────────────────────────────────────────
#
#  What I actually reach for, and what for. One row per tool.
#
#  The rule for this table is that `for` says what the tool does in MY work, not
#  what the tool is. Anyone can read what Python is. The row earns its place by
#  saying which of these projects would not exist without it.
#
#  Languages and runtimes only. A library belongs on the frameworks matrix,
#  which already says which parts use it and whether it has to be installed;
#  repeating three of them here bought nothing but a second place to be wrong.
#
#    name   the tool
#    for    what I use it for, in one line
#    on     projects it is used on. Names must match the bill of materials
#           above, or the build tells you which one is a typo
#    lang   optional. When set, the row gets the same hatch swatch and colour
#           that language carries on the composition sheet, so the two sheets
#           agree about what colour Python is

[[tools]]
name = "Python"
for  = "models, data pipelines, and most of the analysis work"
on   = ["aggregateAnalytics", "floralytics", "Cap_Match_Net"]
lang = "Python"

[[tools]]
name = "C / C++"
for  = "embedded work and the operating-systems projects"
on   = ["small-shell"]
lang = "C"

[[tools]]
name = "Swift"
for  = "native macOS and iOS apps, and the app shells around local servers"
on   = ["animAgent", "GrowthApp", "groupStat"]
lang = "Swift"

[[tools]]
name = "Node, no deps"
for  = "local dashboards, on the standard library so there is no install step"
on   = ["Ground-Control", "orchestrate"]
lang = "JavaScript"




[[tools]]
name = "MATLAB"
for  = "signal processing for plasma thruster data, in the lab"
on   = []

[[tools]]
name = "VHDL"
for  = "FPGA modules for reading micro-sensor signals"
on   = []


# ─── FOCUS AREAS ─────────────────────────────────────────────────────────────
