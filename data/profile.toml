# ─────────────────────────────────────────────────────────────────────────────
#  PROFILE SOURCE OF TRUTH
#
#  This is the only file you need to edit. The README and every SVG card are
#  generated from it by scripts/build.py.
#
#  Nothing else in this repository holds project facts. If a project's status is
#  wrong on the profile, it is wrong here and nowhere else.
#
#      python3 scripts/build.py            # regenerate everything locally
#      python3 scripts/build.py --offline  # regenerate without network calls
#
#  TOML because tomllib is in the standard library, so the build has no
#  dependencies to install and no lockfile to drift.
#
#  THE RULE FOR THIS FILE: every field on every sheet has to be something a
#  stranger could check. No field exists because a drawing usually has one. If
#  a value would have to be invented to fill a box, the box comes off the sheet.
# ─────────────────────────────────────────────────────────────────────────────


[identity]
name     = "Henry Kanaskie"
# The drawing's title block. Set in caps at a large size, so keep it short.
# It names the subject matter, not a self-description.
title    = "MACHINE LEARNING · SIGNAL PROCESSING · TOOLS I USE MYSELF"
tagline  = "I like building things and taking them apart to see how they work."
website  = "https://henrykanaskie.com"
github   = "henrykanaskie"

# The two fields in the title block strip that a build cannot derive. Everything
# else in that strip (project counts, last push, build date) is measured.
status   = "MS STUDENT, OREGON STATE"
location = "CORVALLIS, OREGON"


[about]
# Prose for the general notes sheet. Written as a list so the line breaks in the
# file don't become line breaks on the profile. These are joined with spaces.
body = [
  "I'm a computer science student at Oregon State, working on a master's after",
  "finishing my undergrad there. Most of what's on this sheet exists because I",
  "wanted to use it, or because I didn't understand something well enough and",
  "building it was the only way I was going to. Some of it came out of research:",
  "a matching-network solver for the plasma lab, signal processing for thruster",
  "data. The rest is tools I open every day, and a leaderboard for my group chat.",
]

# The three lines under the prose. Bold with **, as in normal markdown.
points = [
  "Master's in CS at **Oregon State**, after two years of undergrad research in the plasma lab",
  "Six months at **DZYNE Technologies** on embedded C/C++ and the test framework around it",
  "Away from a keyboard I'm usually behind a camera, on skis, or in the gym",
]


# ─── STATUS VOCABULARY ───────────────────────────────────────────────────────
#
#  Status is a band of the completion figure, not a label you set independently,
#  so a CONCEPT can never outrank something in FLIGHT. build.py asserts this:
#
#      CONCEPT < 0.25 <= BREADBOARD < 0.45 <= FLIGHT < 0.95 <= QUALIFIED
#
#  Change a bound here and the check moves with it.
#
#  The QUALIFIED floor is 0.95 and not 0.90 on purpose. Two projects here sit at
#  exactly 0.90, which is the number I would give someone who asked, and it is
#  not the same claim as "done". A vocabulary that rounds 90% up to DONE is a
#  vocabulary that cannot be trusted on the rows where it says DONE.

[[status]]
key   = "QUALIFIED"
mark  = "✓"
floor = 0.95
blurb = "built, working, done"

[[status]]
key   = "FLIGHT"
mark  = "▲"
floor = 0.45
blurb = "in active development"

[[status]]
key   = "BREADBOARD"
mark  = "◗"
floor = 0.25
blurb = "assembled, not yet trustworthy"

[[status]]
key   = "CONCEPT"
mark  = "○"
floor = 0.00
blurb = "scaffold and intent"


# ─── BILL OF MATERIALS ───────────────────────────────────────────────────────
#
#  Each project is a part on the drawing. Order here is the order on the sheet.
#
#    pn         reference designator. Drawings key parts by CLASS-NN rather than
#               a bare serial, because the prefix says what a thing is before you
#               read its name. Classes in use, extend freely:
#                 OPT solver / optimizer      SYS systems and OS-level
#                 QNT quantitative research   MDL model built from scratch
#                 APP end-user application    TUL tool for my own use
#                 EDU teaching material
#    name       repository name
#    lang       must appear in [palette.lang] below
#    status     one of the keys above
#    completion 0.0 to 1.0, and must fall inside that status's band
#    summary    one line, shown collapsed. At most 81 characters, which is what
#               the BOM description column holds. Go over and the build fails
#               and tells you by how much, rather than cutting it with an
#               ellipsis.
#    detail     the expanded paragraph
#    notes      tolerance callouts. Short, factual, no more than three
#    repo       omit entirely for a private or unpushed project
#    private    optional note explaining why there is no link
#    started    date of the FIRST commit, and `last` the most recent one. These
#               drive the timeline sheet. They are read off real git history, not
#               estimated: see the comment on [timeline] below for where each
#               one came from and why the build still trusts the file over the
#               API for some of them.
#    commits    commits in the repository's history, as measured on the same day
#               as `last`. Drawn as the bar's weight on the timeline.

